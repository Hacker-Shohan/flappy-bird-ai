<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird AI</title>
  <style>
    :root {
      --bg: #0d0f18;
      --card: #161926;
      --card-border: #23283b;
      --accent: #00d26a;
      --accent-glow: rgba(0, 210, 106, 0.35);
      --text: #f0f2f8;
      --text-dim: #8c93a8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    header {
      margin-bottom: 12px;
      text-align: center;
    }

    header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .showcase-layout {
      display: flex;
      gap: 18px;
      max-width: 820px;
      width: 100%;
      height: min(520px, 82vh);
      justify-content: center;
      align-items: stretch;
    }

    /* GAME BOX */
    .game-box {
      height: 100%;
      aspect-ratio: 380 / 580;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--card-border);
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      background: #70c5ce;
      flex-shrink: 0;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* RIGHT SHOWCASE PANEL */
    .showcase-panel {
      flex: 1;
      min-width: 320px;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    /* SCORE DISPLAY */
    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .score-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .score-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
    }

    .score-value {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }

    .score-value.highlight {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    /* SPEED & PAUSE CONTROLS */
    .controls-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button#btnPause {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 9px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 80px;
    }

    button#btnPause:hover {
      background: #00ea76;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .slider-box {
      flex: 1;
      background: rgba(0,0,0,0.3);
      padding: 8px 12px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-box input[type="range"] {
      flex: 1;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .speed-label {
      font-weight: 800;
      color: var(--accent);
      min-width: 42px;
      text-align: right;
      font-size: 13px;
    }

    /* BRAIN SYNAPSES CANVAS */
    .brain-card {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #brainCanvas {
      width: 100%;
      flex: 1;
      min-height: 140px;
      display: block;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* MOBILE ADJUSTMENT */
    @media (max-width: 720px) {
      html, body {
        height: auto;
        overflow-y: auto;
      }
      .showcase-layout {
        flex-direction: column;
        height: auto;
      }
      .game-box {
        width: 100%;
        max-width: 320px;
        height: 480px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Flappy Bird AI</h1>
  </header>

  <div class="showcase-layout">
    
    <!-- LEFT: GAME -->
    <div class="game-box">
      <canvas id="gameCanvas" width="380" height="580"></canvas>
    </div>

    <!-- RIGHT: SHOWCASE PANEL -->
    <div class="showcase-panel">

      <!-- 1. SCORE CARD -->
      <div class="card">
        <div class="card-title">Score</div>
        <div class="score-grid">
          <div class="score-box">
            <div class="score-label">Current Score</div>
            <div class="score-value" id="currentScore">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">Verified Record</div>
            <div class="score-value highlight">100,000</div>
          </div>
        </div>
      </div>

      <!-- 2. SPEED & DIFFICULTY CONTROLS -->
      <div class="card">
        <div class="card-title">Simulation Controls</div>
        <div class="controls-row" style="margin-bottom: 8px;">
          <button id="btnPause">Pause</button>
          <div class="slider-box" style="flex: 1;">
            <span style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">Speed</span>
            <input type="range" id="speedSlider" min="1" max="100" value="1">
            <span class="speed-label" id="speedLabel">1x</span>
          </div>
        </div>
        <div class="controls-row">
          <div class="slider-box" style="width: 100%;">
            <span style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">Difficulty</span>
            <input type="range" id="diffSlider" min="1" max="4" value="2" step="1">
            <span class="speed-label" id="diffLabel" style="min-width: 80px; font-size: 12px;">Normal</span>
          </div>
        </div>
      </div>

      <!-- 3. BRAIN SYNAPSES -->
      <div class="card brain-card">
        <div class="card-title">Brain Synapses</div>
        <canvas id="brainCanvas" width="400" height="190"></canvas>
      </div>

    </div>

  </div>

  <script>
    // =========================================================
    // 🧠 100,000-PIPE CHAMPION BRAIN
    // =========================================================
    const CHAMPION_BRAIN = {
      weightsIH: [
        [-0.05269861844743884, 1.7102042178292738, -0.41190485212364214, 0.19680992990435792, -0.8726023753406751],
        [-0.3987036368158145, 0.6867690754029038, -0.5856481607568931, -0.36210371911969075, 0.03213900176237176],
        [1.3155244901946048, 0.5975112216046379, 0.07587161677799142, -1.9237220948677813, 0.11918903899269412],
        [-1.62208761651944, -0.06822734573817252, -0.4076893507688731, -0.19443415559645427, 1.2873837683873792],
        [-0.2458494581448897, -0.5559228868444588, 0.31504989577560283, 0.4388833812279582, -0.7301686966134029],
        [-1.234192527250467, -0.8684664765519594, 0.2854384426792729, 0.7637837645649351, -0.3792836318684601]
      ],
      weightsHO: [
        [-0.5358619848292392, 0.719587482921046, 0.8387458997654752, -0.1653888069716232, 0.3971406239046311, -0.7421520674114281]
      ],
      biasH: [
        -1.508712043746857,
        0.5266058755210948,
        -0.13830376516923326,
        -0.1936305357037234,
        0.3364866792843278,
        0.6965663756602483
      ],
      biasO: [-0.6238284736696265]
    };

    function sigmoid(x) {
      return 1 / (1 + Math.exp(-Math.max(-40, Math.min(40, x))));
    }

    class NeuralNetwork {
      constructor(data) {
        this.inputNodes = 5;
        this.hiddenNodes = 6;
        this.outputNodes = 1;
        this.weightsIH = data.weightsIH;
        this.weightsHO = data.weightsHO;
        this.biasH = data.biasH;
        this.biasO = data.biasO;

        this.lastInputs = new Array(5).fill(0);
        this.lastHidden = new Array(6).fill(0);
        this.lastOutput = 0;
      }

      predict(inputs) {
        this.lastInputs = [...inputs];

        let hidden = [];
        for (let i = 0; i < this.hiddenNodes; i++) {
          let sum = 0;
          for (let j = 0; j < this.inputNodes; j++) {
            sum += inputs[j] * this.weightsIH[i][j];
          }
          sum += this.biasH[i];
          hidden[i] = sigmoid(sum);
        }
        this.lastHidden = [...hidden];

        let outputSum = 0;
        for (let j = 0; j < this.hiddenNodes; j++) {
          outputSum += hidden[j] * this.weightsHO[0][j];
        }
        outputSum += this.biasO[0];
        this.lastOutput = sigmoid(outputSum);

        return this.lastOutput;
      }
    }

    // =========================================================
    // GAME ENGINE & BIRD
    // =========================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRAVITY = 0.35;
    const JUMP = -6.5;
    const PIPE_SPEED = 2.4;
    const PIPE_WIDTH = 55;
    const GROUND_HEIGHT = 70;

    // Difficulty presets (Default is level 2: Normal, matching baseline behavior exactly)
    const DIFFICULTY_PRESETS = {
      1: { name: 'Easy', gap: 165, interval: 125, minH: 60 },
      2: { name: 'Normal', gap: 145, interval: 110, minH: 50 },
      3: { name: 'Hard', gap: 130, interval: 95, minH: 40 },
      4: { name: 'Extreme', gap: 115, interval: 80, minH: 30 }
    };

    let currentPipeGap = 145;
    let currentSpawnInterval = 110;
    let currentMinHeight = 50;

    let simSpeed = 1;
    let isPaused = false;
    let score = 0;
    let frameCount = 0;

    class Bird {
      constructor() {
        this.x = 65;
        this.y = (canvas.height - GROUND_HEIGHT) / 2;
        this.velocity = 0;
        this.radius = 13;
        this.brain = new NeuralNetwork(CHAMPION_BRAIN);
      }

      jump() {
        this.velocity = JUMP;
      }

      think(closestPipe) {
        const defaultGapY = (canvas.height - GROUND_HEIGHT) / 2;
        const pipeDist = closestPipe ? (closestPipe.x - this.x) / canvas.width : 1.0;
        const gapTop = closestPipe ? closestPipe.topHeight / canvas.height : (defaultGapY - 70) / canvas.height;
        const gapBot = closestPipe ? closestPipe.bottomY / canvas.height : (defaultGapY + 70) / canvas.height;

        let inputs = [
          this.y / canvas.height,
          (this.velocity + 10) / 20,
          pipeDist,
          gapTop,
          gapBot
        ];

        if (this.brain.predict(inputs) > 0.5) {
          this.jump();
        }
      }

      update() {
        this.velocity += GRAVITY;
        if (this.velocity > 9) this.velocity = 9;
        this.y += this.velocity;

        if (this.y + this.radius >= canvas.height - GROUND_HEIGHT) {
          this.y = canvas.height - GROUND_HEIGHT - this.radius;
          this.velocity = 0;
        }

        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocity = 0;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.08)));
        ctx.rotate(rotation);

        ctx.strokeStyle = '#00d26a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 5, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#00d26a';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius, this.radius - 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(5, -4, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(6.5, -4, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f07823';
        ctx.beginPath();
        ctx.moveTo(10, -1);
        ctx.lineTo(17, 2);
        ctx.lineTo(10, 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    class Pipe {
      constructor(customX = null) {
        this.x = customX !== null ? customX : canvas.width;
        const minHeight = currentMinHeight;
        const maxHeight = canvas.height - GROUND_HEIGHT - currentPipeGap - minHeight;
        this.topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        this.bottomY = this.topHeight + currentPipeGap;
        this.bottomHeight = canvas.height - GROUND_HEIGHT - this.bottomY;
        this.passed = false;
      }

      update() {
        this.x -= PIPE_SPEED;
      }

      draw() {
        ctx.fillStyle = '#55a630';
        ctx.strokeStyle = '#2b580c';
        ctx.lineWidth = 2;

        ctx.fillRect(this.x, 0, PIPE_WIDTH, this.topHeight);
        ctx.strokeRect(this.x, 0, PIPE_WIDTH, this.topHeight);
        ctx.fillRect(this.x - 3, this.topHeight - 20, PIPE_WIDTH + 6, 20);
        ctx.strokeRect(this.x - 3, this.topHeight - 20, PIPE_WIDTH + 6, 20);

        ctx.fillRect(this.x, this.bottomY, PIPE_WIDTH, this.bottomHeight);
        ctx.strokeRect(this.x, this.bottomY, PIPE_WIDTH, this.bottomHeight);
        ctx.fillRect(this.x - 3, this.bottomY, PIPE_WIDTH + 6, 20);
        ctx.strokeRect(this.x - 3, this.bottomY, PIPE_WIDTH + 6, 20);
      }
    }

    let bird = new Bird();
    let pipes = [new Pipe(canvas.width)];

    function step() {
      frameCount++;

      if (frameCount % currentSpawnInterval === 0) {
        pipes.push(new Pipe());
      }

      let closestPipe = null;
      let minDistance = Infinity;
      for (let pipe of pipes) {
        let dist = (pipe.x + PIPE_WIDTH) - 65;
        if (dist > 0 && dist < minDistance) {
          minDistance = dist;
          closestPipe = pipe;
        }
      }

      bird.think(closestPipe);
      bird.update();

      for (let i = pipes.length - 1; i >= 0; i--) {
        const pipe = pipes[i];
        pipe.update();

        if (!pipe.passed && pipe.x + PIPE_WIDTH < 65) {
          pipe.passed = true;
          score++;
          document.getElementById('currentScore').textContent = score.toLocaleString();
        }

        if (pipe.x + PIPE_WIDTH < -10) {
          pipes.splice(i, 1);
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pipes.forEach(pipe => pipe.draw());

      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
      ctx.fillStyle = '#73be2e';
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 12);
      ctx.fillStyle = '#559c1c';
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT + 12, canvas.width, 3);

      bird.draw();
      drawBrain(bird.brain);
    }

    // =========================================================
    // BRAIN SYNAPSES VISUALIZER
    // =========================================================
    const brainCanvas = document.getElementById('brainCanvas');
    const brainCtx = brainCanvas.getContext('2d');
    const inputLabels = ['Height', 'Speed', 'Dist', 'GapTop', 'GapBot'];

    function drawBrain(nn) {
      brainCtx.clearRect(0, 0, brainCanvas.width, brainCanvas.height);

      const w = brainCanvas.width;
      const h = brainCanvas.height;

      const xIn = 60;
      const xHid = w / 2;
      const xOut = w - 55;

      const inY = [];
      for (let i = 0; i < nn.inputNodes; i++) {
        inY.push((h / (nn.inputNodes + 1)) * (i + 1));
      }

      const hidY = [];
      for (let i = 0; i < nn.hiddenNodes; i++) {
        hidY.push((h / (nn.hiddenNodes + 1)) * (i + 1));
      }

      const outY = [h / 2];

      // Input -> Hidden Connections
      for (let i = 0; i < nn.hiddenNodes; i++) {
        for (let j = 0; j < nn.inputNodes; j++) {
          let weight = nn.weightsIH[i][j];
          let alpha = Math.min(1, Math.abs(weight));
          brainCtx.strokeStyle = weight > 0 ? `rgba(0, 210, 106, ${alpha * 0.7})` : `rgba(255, 77, 77, ${alpha * 0.7})`;
          brainCtx.lineWidth = Math.min(3, Math.abs(weight) * 2);
          brainCtx.beginPath();
          brainCtx.moveTo(xIn, inY[j]);
          brainCtx.lineTo(xHid, hidY[i]);
          brainCtx.stroke();
        }
      }

      // Hidden -> Output Connections
      for (let j = 0; j < nn.hiddenNodes; j++) {
        let weight = nn.weightsHO[0][j];
        let alpha = Math.min(1, Math.abs(weight));
        brainCtx.strokeStyle = weight > 0 ? `rgba(0, 210, 106, ${alpha * 0.8})` : `rgba(255, 77, 77, ${alpha * 0.8})`;
        brainCtx.lineWidth = Math.min(3.5, Math.abs(weight) * 2.5);
        brainCtx.beginPath();
        brainCtx.moveTo(xHid, hidY[j]);
        brainCtx.lineTo(xOut, outY[0]);
        brainCtx.stroke();
      }

      // Input Nodes
      for (let j = 0; j < nn.inputNodes; j++) {
        let val = nn.lastInputs[j] || 0;
        brainCtx.fillStyle = `rgb(${Math.floor(val * 255)}, ${Math.floor(val * 200)}, 50)`;
        brainCtx.beginPath();
        brainCtx.arc(xIn, inY[j], 7, 0, Math.PI * 2);
        brainCtx.fill();
        brainCtx.strokeStyle = '#fff';
        brainCtx.lineWidth = 1.5;
        brainCtx.stroke();

        brainCtx.fillStyle = '#8c93a8';
        brainCtx.font = '10px sans-serif';
        brainCtx.textAlign = 'right';
        brainCtx.fillText(inputLabels[j], xIn - 10, inY[j] + 3.5);
      }

      // Hidden Nodes
      for (let i = 0; i < nn.hiddenNodes; i++) {
        let val = nn.lastHidden[i] || 0;
        brainCtx.fillStyle = `rgb(50, ${Math.floor(val * 230)}, ${Math.floor(val * 255)})`;
        brainCtx.beginPath();
        brainCtx.arc(xHid, hidY[i], 7, 0, Math.PI * 2);
        brainCtx.fill();
        brainCtx.strokeStyle = '#fff';
        brainCtx.lineWidth = 1.5;
        brainCtx.stroke();
      }

      // Output Node
      let outVal = nn.lastOutput || 0;
      let isFlapping = outVal > 0.5;
      brainCtx.fillStyle = isFlapping ? '#00d26a' : '#222';
      brainCtx.beginPath();
      brainCtx.arc(xOut, outY[0], 11, 0, Math.PI * 2);
      brainCtx.fill();
      brainCtx.strokeStyle = isFlapping ? '#fff' : '#666';
      brainCtx.lineWidth = 2;
      brainCtx.stroke();

      brainCtx.fillStyle = isFlapping ? '#00d26a' : '#8c93a8';
      brainCtx.font = 'bold 11px sans-serif';
      brainCtx.textAlign = 'left';
      brainCtx.fillText(isFlapping ? 'FLAP' : 'GLIDE', xOut + 15, outY[0] + 4);
    }

    // =========================================================
    // CONTROLS & MAIN LOOP
    // =========================================================
    const btnPause = document.getElementById('btnPause');
    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.textContent = isPaused ? 'Resume' : 'Pause';
    });

    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    speedSlider.addEventListener('input', (e) => {
      simSpeed = parseInt(e.target.value, 10);
      speedLabel.textContent = `${simSpeed}x`;
    });

    const diffSlider = document.getElementById('diffSlider');
    const diffLabel = document.getElementById('diffLabel');
    diffSlider.addEventListener('input', (e) => {
      const level = parseInt(e.target.value, 10);
      const preset = DIFFICULTY_PRESETS[level] || DIFFICULTY_PRESETS[2];
      currentPipeGap = preset.gap;
      currentSpawnInterval = preset.interval;
      currentMinHeight = preset.minH;
      diffLabel.textContent = preset.name;
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        btnPause.click();
      }
    });

    function loop() {
      if (!isPaused) {
        for (let n = 0; n < simSpeed; n++) {
          step();
        }
      }
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
